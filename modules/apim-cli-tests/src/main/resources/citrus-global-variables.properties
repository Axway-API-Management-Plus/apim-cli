# Defaults for the integration tests. Plain values only.
# This file is read twice: by Spring as a @PropertySource and by the Citrus GlobalVariablesPropertyLoader.
# Citrus resolves ${...} as a Citrus test variable and fails on anything it does not know, so placeholders
# must NOT be used here. Credentials and the host are taken from environment variables instead, see
# EndpointConfig#setEnvironment:
#   apimanager_host     -> apiManagerHost
#   apimanager_password -> apiManagerPass
#   oadmin_password     -> oadminPassword1
apiManagerHost=localhost
apiManagerPort=8075
# This user-account is only used for the initial-test to set up the environment.
apiManagerUser=apiadmin
apiManagerPass=
enforce=true
API_VERSION=/api/portal/v1.4
orgNumber=2172
orgName=API Development 2172
oadminUsername1=testoadmin
oadminPassword1=
testAppName=Test_Consumer
orgName2=API Development 4172
orgName3=API Development 5172
